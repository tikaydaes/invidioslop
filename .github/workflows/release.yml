# Push a tag like v0.1.1 to submit that version to addons.mozilla.org (listed)
# and create a matching GitHub release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches manifest version
        run: |
          version=$(jq -r .version manifest.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi

      - name: Lint
        run: npx --yes web-ext@10 lint

      # Listed versions are distributed by AMO once approved, so don't wait
      # for review here (it can take anywhere from minutes to days).
      - name: Submit to addons.mozilla.org
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: >
          npx --yes web-ext@10 sign
          --channel=listed
          --amo-metadata=.github/amo-metadata.json
          --approval-timeout=0

      - name: Build unsigned zip
        run: |
          version=$(jq -r .version manifest.json)
          npx --yes web-ext@10 build --artifacts-dir out --filename "invidioslop-$version-unsigned.zip"
          unzip -q "out/invidioslop-$version-unsigned.zip" -d unpacked
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: invidioslop-${{ env.VERSION }}-unsigned
          path: unpacked/
          if-no-files-found: error

      # The unsigned zip is attached for temporary installs (about:debugging);
      # the signed build comes from addons.mozilla.org once approved.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          "out/invidioslop-$VERSION-unsigned.zip"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --notes "Install from https://addons.mozilla.org/firefox/addon/invidioslop/ (available once Mozilla has approved this version). The attached zip is unsigned: load it temporarily via about:debugging → This Firefox → Load Temporary Add-on."
