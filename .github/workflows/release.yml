# Push a tag like v0.1.1 to submit that version to addons.mozilla.org (listed)
# and create a matching GitHub release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          version=$(jq -r .version manifest.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi

      - name: Lint
        run: npx --yes web-ext@10 lint

      # Listed versions are distributed by AMO once approved, so don't wait
      # for review here (it can take anywhere from minutes to days).
      - name: Submit to addons.mozilla.org
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: >
          npx --yes web-ext@10 sign
          --channel=listed
          --amo-metadata=.github/amo-metadata.json
          --approval-timeout=0

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --notes "Install from https://addons.mozilla.org/firefox/addon/invidioslop/ (available once Mozilla has approved this version)."
